<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="finreqGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4a5a"/>
      <stop offset="100%" stop-color="#db3847"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background Badge (Crimson squircle with crisp bevel) -->
  <rect width="64" height="64" rx="16" fill="url(#finreqGrad)"/>
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.2"/>

  <!-- Geometric Modern 'F' Monogram with Requirement Nodes -->
  <g filter="url(#softGlow)" fill="#ffffff">
    <!-- Main Vertical Pillar -->
    <rect x="15" y="15" width="8" height="34" rx="3"/>
    <!-- Top Horizontal Bar -->
    <path d="M23 15 H45 C46.657 15 48 16.343 48 18 V20 C48 21.657 46.657 23 45 23 H23 V15 Z"/>
    <!-- Middle Horizontal Bar -->
    <path d="M23 29 H39 C40.657 29 42 30.343 42 32 V34 C42 35.657 40.657 37 39 37 H23 V29 Z"/>
    <!-- Validation Node / Indicator -->
    <circle cx="43" cy="45" r="4" fill="#ffffff"/>
  </g>
</svg>
