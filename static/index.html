<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinReq AI | SDLC Architect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #050505;
            --bg-card: #111111;
            --accent-blue: #4285f4;
            --accent-red: #ea4335;
            --accent-glow: rgba(66, 133, 244, 0.15);
        }

        body {
            background-color: var(--bg-dark);
            color: #e8eaed;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        /* Gemini-style illuminating background */
        .glow-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background:
                radial-gradient(circle at 20% 20%, rgba(66, 133, 244, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(234, 67, 53, 0.05) 0%, transparent 40%);
            pointer-events: none;
        }

        .glass {
            background: rgba(17, 17, 17, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .chat-container { height: calc(100vh - 180px); }

        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }

        /* Gemini-style input box */
        .input-container {
            background: #1e1f20;
            border: 1px solid transparent;
            transition: border 0.3s, box-shadow 0.3s;
        }
        .input-container:focus-within {
            border-color: #4285f4;
            box-shadow: 0 0 15px var(--accent-glow);
        }

        /* Message styling */
        .user-msg {
            background: #2b2c2f;
            color: #e8eaed;
            border-radius: 22px 22px 4px 22px;
        }
        .ai-msg {
            background: rgba(17, 17, 17, 0.4);
            color: #e8eaed;
            border-radius: 22px 22px 22px 4px;
            border: 1px solid rgba(66, 133, 244, 0.2);
            transition: border 0.3s, box-shadow 0.3s;
        }
        .ai-msg:hover {
            border-color: #4285f4;
            box-shadow: 0 0 10px var(--accent-glow);
        }

        .gradient-text {
            background: linear-gradient(90deg, #4285f4, #ea4335, #fbbc05, #34a853);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: bold;
        }

        .phase-badge {
            background: rgba(66, 133, 244, 0.1);
            color: #8ab4f8;
            border: 1px solid rgba(66, 133, 244, 0.2);
        }
    </style>
</head>
<body class="font-sans overflow-hidden">
    <div class="glow-bg"></div>

    <div class="flex h-screen">
        <!-- Main Content -->
        <div class="flex-1 flex flex-col relative">
            <!-- Header -->
            <header class="p-5 flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-blue-500 to-red-500 flex items-center justify-center shadow-lg">
                        <i class="fas fa-bolt text-white text-xs"></i>
                    </div>
                    <h1 class="text-lg font-medium text-slate-200">FinReq <span class="gradient-text">AI</span></h1>
                </div>
                <div class="flex gap-3">
                    <span class="px-3 py-1 rounded-full phase-badge text-xs font-medium transition-all">
                        <i class="fas fa-circle text-[8px] mr-2 animate-pulse"></i>System Online
                    </span>
                </div>
            </header>

            <!-- Chat Area -->
            <div id="chat-window" class="chat-container overflow-y-auto p-6 space-y-8 custom-scrollbar">
                <!-- Welcome Message -->
                <div class="flex justify-start">
                    <div class="ai-msg p-4 max-w-2xl">
                        <div class="flex items-start gap-3">
                            <div class="w-6 h-6 rounded-full bg-blue-600 flex-shrink-0 flex items-center justify-center text-[10px] text-white font-bold">AI</div>
                            <p class="text-slate-300 leading-relaxed">
                                Hello. I am your <span class="text-blue-400 font-medium">Financial SDLC Architect</span>.
                                <br><br>
                                Describe your project idea, and I'll help you gather requirements, ensure regulatory compliance, and recommend the optimal SDLC model.
                            </p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Input Area -->
            <div class="p-6">
                <div class="max-w-3xl mx-auto relative">
                    <div class="input-container flex items-center p-2 rounded-full shadow-2xl">
                        <button class="p-3 text-slate-400 hover:text-blue-400 transition">
                            <i class="fas fa-plus"></i>
                        </button>
                        <input type="text" id="user-input"
                            class="flex-1 bg-transparent p-3 text-slate-200 focus:outline-none placeholder-slate-500"
                            placeholder="Enter a prompt here...">
                        <div class="flex items-center justify-center p-1">
                            <button id="send-btn" class="p-2 bg-white text-black hover:bg-slate-200 rounded-full transition shadow-md transform hover:scale-105 active:scale-95">
                                <i class="fas fa-arrow-up text-xs"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
