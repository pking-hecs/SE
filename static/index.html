<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinReq AI | SDLC Architect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #0f172a; color: #f8fafc; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        .chat-container { height: calc(100vh - 200px); }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body class="font-sans overflow-hidden">
    <div class="flex h-screen">
        <!-- Main Content -->
        <div class="flex-1 flex flex-col relative">
            <!-- Header -->
            <header class="p-6 glass flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <i class="fas fa-university text-blue-400 text-2xl"></i>
                    <h1 class="text-xl font-semibold">FinReq AI: Financial SDLC Architect</h1>
                </div>
                <div class="flex gap-4">
                    <span class="px-3 py-1 rounded-full bg-green-500/20 text-green-400 text-xs border border-green-500/30">● System Online (Gemma 4)</span>
                </div>
            </header>

            <!-- Chat Area -->
            <div id="chat-window" class="chat-container overflow-y-auto p-6 space-y-6 custom-scrollbar">
                <!-- Welcome Message -->
                <div class="flex justify-start">
                    <div class="glass p-4 rounded-2xl max-w-2xl">
                        <p class="text-slate-300">Welcome! I am your **Financial SDLC Architect**. Describe your project idea, and I will generate the full SRS and SDLC plan for you.</p>
                    </div>
                </div>
            </div>

            <!-- Input Area -->
            <div class="p-6">
                <div class="max-w-4xl mx-auto relative">
                    <input type="text" id="user-input"
                        class="w-full p-4 pr-16 glass rounded-2xl focus:outline-none focus:ring-2 focus:ring-blue-500 transition"
                        placeholder="Enter financial project idea (e.g. Digital Wallet for rural banks)...">
                    <button id="send-btn" class="absolute right-3 top-3 p-2 bg-blue-600 hover:bg-blue-500 rounded-xl transition text-white">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
